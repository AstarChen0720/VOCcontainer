<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <img src="涼宮春日.jpg" alt="涼宮春日" />
    <p>我對普通的人類沒有興趣</p>
    <p>假如你們當中如果有</p>
    <p>外星人,未來人,異世界人或超能力者的話</p>
    <p>儘管來找我吧!!</p>
    <p>
      布局类html标签就是一些自带默认样式的东西而已,ex可以自訂一個標籤叫做&lt;star&gt;他有著h1的css,這樣他的行為就會跟h1一模一樣
    </p>
    <star
      style="
        display: block;
        font-size: 2em;
        margin-block-start: 0.67em;
        margin-block-end: 0.67em;
        margin-inline-start: 0px;
        margin-inline-end: 0px;
        font-weight: bold;
        unicode-bidi: isolate;
      "
      >這樣他就會跟h1行為一模一樣
    </star>
  </body>
</html>
